version: '3.8'

services:
  redis:
    command: redis-server --appendonly yes --requirepass letsgopass123
    environment:
      - REDIS_PASSWORD=letsgopass123

  backend:
    environment:
      - DATABASE_URL=sqlite:///./price_tracker.db
      - CELERY_BROKER_URL=redis://:letsgopass123@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:letsgopass123@redis:6379/0
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  celery_worker:
    environment:
      - DATABASE_URL=sqlite:///./price_tracker.db
      - CELERY_BROKER_URL=redis://:letsgopass123@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:letsgopass123@redis:6379/0
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
